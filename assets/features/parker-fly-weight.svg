</g>
<g font-size="26" fill="#8f8f8c" text-anchor="middle">
<text x="120" y="765">0</text><text x="392" y="765">2</text><text x="664" y="765">4</text><text x="936" y="765">6</text><text x="1208" y="765">8</text><text x="1480" y="765">10</text>
