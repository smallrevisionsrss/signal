name: Build and deploy Signal

# Rebuilds the static site whenever the data or the generator changes,
# and deploys it to GitHub Pages at signal.smallrevisions.com.

on:
  push:
    branches: [main]
    paths:
      - 'signal-issues-data.json'
      - 'site_build.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build site
        run: |
          python3 site_build.py \
            --data signal-issues-data.json \
            --out _site \
            --domain signal.smallrevisions.com

      - name: Sanity checks
        run: |
          set -e
          test -f _site/index.html
          test -f _site/feed.xml
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/CNAME
          test -f _site/182a146f131abb081b50fb231b669a70.txt
          test -f _site/indexnow.json
          # Self-hosted assets. site_build.py falls back to the old remote
          # URLs when these are missing, which keeps a local run working but
          # would silently ship a build depending on a retired repo and the
          # shop's CDN again. Fail here instead, loudly.
          test -f _site/assets/logo.svg
          test -f _site/assets/crate.png
          python3 - <<'PY'
          import json, re, glob, sys
          import xml.etree.ElementTree as ET
          bad = 0
          for f in glob.glob('_site/**/*.html', recursive=True):
              h = open(f, encoding='utf-8').read()
              for m in re.findall(r'<script type="application/ld\+json">(.*?)</script>', h, re.S):
                  try:
                      json.loads(m)
                  except Exception as e:
                      print('BAD JSON-LD', f, e); bad += 1
          for f in ('_site/feed.xml', '_site/sitemap.xml'):
              try:
                  ET.parse(f)
              except Exception as e:
                  print('BAD XML', f, e); bad += 1
          # the whole point: content must be in the served HTML
          home = open('_site/index.html', encoding='utf-8').read()
          links = len(re.findall(r'href="https?://(?!signal\.|www\.smallrevisions)', home))
          print('outbound article links in raw home HTML:', links)
          if links < 20:
              print('FAIL: home page is not server-rendered'); bad += 1
          sys.exit(1 if bad else 0)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell IndexNow the moment the new issue is live. After deploy on purpose:
  # pinging before the pages are served would send the crawler to yesterday's
  # copy. Bing, Yandex and the other participating engines share one endpoint.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new pages to be served
        run: sleep 45

      - name: Ping IndexNow
        run: |
          set -euo pipefail
          KEY=182a146f131abb081b50fb231b669a70
          HOST=signal.smallrevisions.com

          SERVED=$(curl -fsS "https://$HOST/$KEY.txt" || echo MISSING)
          if [ "$SERVED" != "$KEY" ]; then
            echo "key file not served correctly (got: $SERVED)"
            exit 1
          fi

          curl -fsS "https://$HOST/indexnow.json" -o /tmp/indexnow.json
          echo "submitting:"
          cat /tmp/indexnow.json

          CODE=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @/tmp/indexnow.json)

          echo "IndexNow responded $CODE"
          cat /tmp/indexnow.out || true

          case "$CODE" in
            200|202) echo "submitted" ;;
            *) echo "IndexNow rejected the submission"; exit 1 ;;
          esac
